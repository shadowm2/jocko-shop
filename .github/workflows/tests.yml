name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      # `composer setup` migrates the database named in .env.example (MySQL),
      # which does not exist on a runner. The tests use in-memory SQLite anyway,
      # so give setup a throwaway SQLite database instead.
      - name: Setup Application
        run: composer setup
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run CI Checks
        run: composer ci:check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        timeout-minutes: 5
        # Playwright's server outlives pest and holds its output pipe open, which keeps the step running; a file does not.
        # The timeout makes a hung test fail with its log instead of cancelling the step with none.
        run: |
          timeout -s KILL 200 vendor/bin/pest tests/Browser --stop-on-failure > browser.log 2>&1 < /dev/null || status=$?
          cat browser.log
          exit "${status:-0}"
